[package]
edition.workspace = true
license.workspace = true
name = "bd3-guardian-v2"
version.workspace = true

[lib]
name = "bd3_guardian_v2"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
bd3-api = { workspace = true }
bd3-core = { workspace = true }
bd3-extension-api = { workspace = true }
bd3-features = { workspace = true }
bd3-http-client = { workspace = true }
bd3-login = { workspace = true }
bd3-model-provider = { workspace = true }
bd3-protocol = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
anyhow = { workspace = true }
bd3-model-provider-info = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
