bd3-extension-items = { workspace = true }
bd3-login = { workspace = true }
bd3-model-provider = { workspace = true }
bd3-model-provider-info = { workspace = true }
bd3-protocol = { workspace = true }
bd3-tools = { workspace = true }
bd3-utils-absolute-path = { workspace = true }
bd3-utils-image = { workspace = true }
bd3-utils-path-uri = { workspace = true }
http = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
