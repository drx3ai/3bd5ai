[package]
edition.workspace = true
license.workspace = true
name = "bd3-goal-extension"
version.workspace = true

[lib]
name = "bd3_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
bd3-analytics = { workspace = true }
bd3-core = { workspace = true }
bd3-extension-api = { workspace = true }
bd3-otel = { workspace = true }
bd3-protocol = { workspace = true }
bd3-rollout = { workspace = true }
bd3-state = { workspace = true }
bd3-tools = { workspace = true }
bd3-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
bd3-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
