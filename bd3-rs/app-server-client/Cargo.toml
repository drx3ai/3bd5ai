[package]
name = "bd3-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bd3_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
bd3-app-server = { workspace = true }
bd3-app-server-protocol = { workspace = true }
bd3-arg0 = { workspace = true }
bd3-config = { workspace = true }
bd3-core = { workspace = true }
bd3-exec-server = { workspace = true }
bd3-feedback = { workspace = true }
bd3-protocol = { workspace = true }
bd3-uds = { workspace = true }
bd3-utils-absolute-path = { workspace = true }
bd3-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
