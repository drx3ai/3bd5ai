[package]
edition.workspace = true
license.workspace = true
name = "bd3-rollout"
version.workspace = true

[lib]
doctest = false
name = "bd3_rollout"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
bd3-extension-items = { workspace = true }
bd3-file-search = { workspace = true }
bd3-git-utils = { workspace = true }
bd3-history = { workspace = true }
bd3-otel = { workspace = true }
bd3-protocol = { workspace = true }
bd3-state = { workspace = true }
bd3-utils-absolute-path = { workspace = true }
bd3-utils-path = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = [
    "formatting",
    "local-offset",
    "macros",
    "parsing",
] }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
bd3-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
