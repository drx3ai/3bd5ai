[package]
name = "bd3-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bd3-app-server"
path = "src/main.rs"

[[bin]]
name = "bd3-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "bd3_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
