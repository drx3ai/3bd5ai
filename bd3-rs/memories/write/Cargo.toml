[package]
edition.workspace = true
license.workspace = true
name = "bd3-memories-write"
version.workspace = true

[lib]
name = "bd3_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
bd3-backend-client = { workspace = true }
bd3-core = { workspace = true }
bd3-config = { workspace = true }
bd3-features = { workspace = true }
bd3-git-utils = { workspace = true }
bd3-login = { workspace = true }
bd3-model-provider = { workspace = true }
bd3-otel = { workspace = true }
bd3-protocol = { workspace = true }
bd3-rollout = { workspace = true }
bd3-rollout-trace = { workspace = true }
bd3-secrets = { workspace = true }
bd3-state = { workspace = true }
bd3-terminal-detection = { workspace = true }
bd3-utils-absolute-path = { workspace = true }
bd3-utils-output-truncation = { workspace = true }
bd3-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
bd3-model-provider-info = { workspace = true }
bd3-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
